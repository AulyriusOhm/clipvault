<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipVault — comparateur de mockups</title>
<style>
  :root {
    --bg: #101010;
    --panel: #171717;
    --line: #2a2a2a;
    --fg: #e7e3dd;
    --dim: #8c867e;
    --acc: #d9a05b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  h1 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .group { display: flex; gap: 2px; }
  button {
    font: inherit; color: var(--dim); background: transparent;
    border: 1px solid transparent; border-radius: 3px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { color: var(--fg); background: var(--panel); }
  button[aria-pressed="true"] { color: var(--bg); background: var(--acc); border-color: var(--acc); font-weight: 600; }
  .sep { width: 1px; height: 22px; background: var(--line); }
  main { padding: 0; }
  iframe { display: block; width: 100%; height: calc(100vh - 59px); border: 0; background: #000; }
  .hint { margin-left: auto; color: var(--dim); font-size: 12px; }
  code { font: 12px ui-monospace, monospace; color: var(--acc); }
</style>
</head>
<body>
<header>
  <h1>ClipVault</h1>
  <div class="group" id="variants">
    <button data-v="a" aria-pressed="true">A · Kimi K3.1 Pro</button>
    <button data-v="b" aria-pressed="false">B · MiMo V2.6 Pro</button>
    <button data-v="c" aria-pressed="false">C · DeepSeek V4.1 Flash</button>
  </div>
  <div class="sep"></div>
  <div class="group" id="screens">
    <button data-s="library" aria-pressed="true">Library</button>
    <button data-s="watch" aria-pressed="false">Watch</button>
    <button data-s="upload" aria-pressed="false">Upload</button>
    <button data-s="login" aria-pressed="false">Login</button>
  </div>
  <span class="hint">Chemins : <code id="path"></code></span>
</header>
<main><iframe id="view" title="mockup"></iframe></main>
<script>
  const dirs = { a: "a-kimi", b: "b-mimo", c: "c-deepseek" };
  const state = { v: "a", s: "library" };
  const view = document.getElementById("view");
  const path = document.getElementById("path");

  function render() {
    const src = dirs[state.v] + "/" + state.s + ".html";
    view.src = src;
    path.textContent = "mockups/" + src;
    for (const b of document.querySelectorAll("#variants button"))
      b.setAttribute("aria-pressed", String(b.dataset.v === state.v));
    for (const b of document.querySelectorAll("#screens button"))
      b.setAttribute("aria-pressed", String(b.dataset.s === state.s));
  }
  for (const b of document.querySelectorAll("#variants button"))
    b.onclick = () => { state.v = b.dataset.v; render(); };
  for (const b of document.querySelectorAll("#screens button"))
    b.onclick = () => { state.s = b.dataset.s; render(); };
  render();
</script>
</body>
</html>
