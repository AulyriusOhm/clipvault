services:
  clipvault:
    build: .
    image: clipvault:latest
    container_name: clipvault
    restart: unless-stopped
    ports:
      - "8099:8099"
    env_file: .env
    volumes:
      - ./data:/app/data
      - /srv/fireshare/clipvault/media:/media
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
